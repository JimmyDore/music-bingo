  <g>
    <rect x="7"  y="7"  width="15" height="15" rx="4" fill="#ffd83d"/>
    <rect x="24.5" y="7"  width="15" height="15" rx="4" fill="#1d1539" stroke="#3b2d67" stroke-width="2"/>
    <rect x="42" y="7"  width="15" height="15" rx="4" fill="#ffd83d"/>
    <rect x="7"  y="24.5" width="15" height="15" rx="4" fill="#1d1539" stroke="#3b2d67" stroke-width="2"/>
    <rect x="24.5" y="24.5" width="15" height="15" rx="4" fill="#ffd83d"/>
    <rect x="42" y="24.5" width="15" height="15" rx="4" fill="#1d1539" stroke="#3b2d67" stroke-width="2"/>
    <rect x="7"  y="42" width="15" height="15" rx="4" fill="#ffd83d"/>
    <rect x="24.5" y="42" width="15" height="15" rx="4" fill="#1d1539" stroke="#3b2d67" stroke-width="2"/>
