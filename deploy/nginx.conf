server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # nginx ne connaît pas l'extension .webmanifest : sans ça le manifeste part
    # en application/octet-stream et Android ignore l'invite d'installation.
    # On surcharge le type sur ce seul fichier — un bloc `types` ici
    # remplacerait toute la table MIME héritée et casserait le CSS et le JS.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # L'API tourne dans le conteneur voisin, sur le réseau Docker partagé.
    location /api/ {
        proxy_pass http://musicbingo-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets fingerprintés par Vite : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA : /ABCD et /m/ABCD sont des routes client, pas des fichiers.
    #
    # `index.html` est le seul fichier non fingerprinté, et c'est lui qui désigne
    # les bundles. Sans en-tête explicite, le navigateur lui applique un cache
    # heuristique : il le ressert sans rien demander au réseau, donc il continue
    # de charger les anciens `/assets/`, eux marqués `immutable` pour un an. Le
    # téléphone tourne alors sur la version d'avant le déploiement — c'est ce qui
    # a fait qu'un bingo validé s'affichait « Partie terminée » au lieu de
    # l'écran de victoire, des jours après la mise en ligne de celui-ci.
    #
    # `no-cache` ne veut pas dire « ne cache pas » : le navigateur garde le
    # fichier mais le revalide à chaque fois. Un déploiement sans changement
    # répond 304, donc ça ne coûte rien.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
